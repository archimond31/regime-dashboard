name: Build Regime Dashboard

on:
  push:
    branches: [main]          # 首次推送 / 代码更新即触发，立即构建部署
  schedule:
    # 每天 UTC 13:30 = 北京时间 21:30（覆盖当日完整日线）
    - cron: '30 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dashboard
        env:
          REGIME_PROXY: none   # GitHub 云端直连，不走本地代理
        run: |
          python build_dashboard.py
          mkdir -p dist
          cp regime_dashboard.html dist/index.html
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Enable GitHub Pages (自动开启)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resp=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "$resp"
          code=$(echo "$resp" | tail -n1)
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "409" ]; then
            echo "::warning::开启 Pages 返回 HTTP $code（若失败可手动 Settings→Pages→Deploy from a branch→gh-pages）"
          fi
