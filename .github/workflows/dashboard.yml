name: Build Regime Dashboard

on:
  push:
    branches: [main]          # 首次推送 / 代码更新即触发，立即构建部署
  schedule:
    # 每天 UTC 13:30 = 北京时间 21:30（覆盖当日完整日线）
    - cron: '30 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 并发控制：同一时间只跑一个部署，新的进来就取消排队中的旧任务
# 避免定时任务与手动推送/重新运行互相覆盖 gh-pages
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dashboard
        env:
          REGIME_PROXY: none   # GitHub 云端直连，不走本地代理
        run: |
          python build_dashboard.py
          mkdir -p dist
          cp regime_dashboard.html dist/index.html
          # 状态快照：供下次构建对比「今日状态切换」与失败降级，随站点一起发布
          cp monitor_state.json dist/monitor_state.json 2>/dev/null || true
          # 多周期验证报告（结论快照，不在 CI 内重算）
          cp backtest_multi_tf.html dist/backtest_multi_tf.html 2>/dev/null || true
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
