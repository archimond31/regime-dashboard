name: Crypto Signal (4H)

# 双触发：schedule 兜底 + workflow_dispatch 供外部定时器精确触发。
#
# 为什么两个都要 —— 2026-11 实测教训：
#   · GitHub schedule 会延迟 0.5~9 小时、6 次/天只落到 2 次（数据见下），不能当 4H 时钟；
#   · 但它是唯一「零外部依赖」的触发器。曾一度把它删掉、等外部定时器上线，
#     结果外部那块没配好，24 小时零触发、一封邮件都没有。「晚到」远好于「什么都没有」。
#   · 外部定时器（cron-job.org 之类）按 UTC 整点 :05 调 workflow_dispatch，可准时到分钟级。
# 两者并存不会重复发信：去重台账按 run_id 分键持久化（见下方 cache 步骤），
# 同一根 4H 只可能成功发一次。
#
# GitHub schedule 实测延迟：
#   应 11-10 16:05 → 实际 19:39（+3h34m）；应 11-11 00:05 → 实际 00:36（+31m）
#   dashboard 应 13:30 → 实际 20:30（+7h）、前一晚 23:03（+9h33m）
on:
  # 2026-11-13 起信号链路改在本地 Windows 任务计划全时段跑
  # （见 deploy/install_task.ps1，每天 6 班：北京 08:05/12:05/16:05/20:05/00:05/04:05）。
  #
  # 云端 schedule 停用，原因是**两套台账各自独立**：ci 的 .notify_state.json 存在
  # actions/cache 里，本地那份在仓库目录，彼此看不见。同时跑 = 同一根 4H 发两封信。
  # 11-13 已经踩过一次（本地信号信 + 云端日报）。
  #
  # 需要云端兜底时（比如笔记本要长期关机），把下面两行取消注释即可恢复，不会和本地冲突
  # —— 冲突只在「两边同时跑」时发生。
  # schedule:
  #   - cron: '5 0,1,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      digest:
        description: '强制按日报模式发（每天北京最多一封）；不勾也会在当天第一封自动补'
        type: boolean
        default: false
      always:
        description: '本轮无动作也发信（仍受同 bar 去重）'
        type: boolean
        default: false
      force:
        description: '忽略去重台账，强制重发'
        type: boolean
        default: false

# 只读：本流程不回写仓库
permissions:
  contents: read

concurrency:
  group: crypto-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 语法预检：3.11 比本地 3.13 严格 —— f-string 表达式里的反斜杠在 3.12 才放开
      # （PEP 701），本地能跑、云端报 SyntaxError。放在取数之前，让错误以「语法」的名义出现，
      # 而不是埋在几分钟下载之后的 traceback 里。
      - name: 语法预检（按 3.11 规则编译全部脚本）
        run: |
          python - <<'PY'
          import glob, py_compile, sys
          bad = []
          for f in sorted(glob.glob("*.py")):
              try:
                  py_compile.compile(f, cfile=None, doraise=True)
              except py_compile.PyCompileError as e:
                  msg = str(e).strip().splitlines()[-1]
                  bad.append((f, msg))
          for f, m in bad:
              print(f"::error file={f}::{m}")
          if bad:
              sys.exit(1)
          print(f"语法预检通过（{len(glob.glob('*.py'))} 个文件）")
          PY

      # 缓存按「UTC 日期」分桶：当天第一次跑存一份，后几次直接命中。
      # 不能按 run_id 做 key —— 那样每次都会存一份 77 MB，很快撑爆缓存配额。
      - name: 生成缓存日期键
        id: k
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 恢复 K 线缓存（按 UTC 日期分桶，当天首次存、后续命中）
        uses: actions/cache@v4
        with:
          path: |
            .cache_binance
            .cache_hl
          key: sig-data-${{ steps.k.outputs.day }}
          restore-keys: |
            sig-data-

      # 台账必须「每次运行都存」：日键缓存当天不可变，状态会冻结在当天第一次运行，
      # 于是同一根 4H 的第二次触发会重复发信。改用 run_id 分键 + 前缀恢复，
      # 每次只存几百字节，代价可忽略，换来去重真正持久 —— 这样 schedule 与外部定时器
      # 可以同时存在而不打架。
      - name: 恢复去重台账（每次运行独立键，按前缀取最新）
        uses: actions/cache@v4
        with:
          path: .notify_state.json
          key: sig-state-${{ github.run_id }}
          restore-keys: |
            sig-state-

      - name: 写入邮件配置
        env:
          SMTP_PASS: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::缺少 secret QQ_SMTP_AUTH_CODE（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          python -c "import json,os; json.dump({'host':'smtp.qq.com','port':465,'user':'1084328481@qq.com','pass':os.environ['SMTP_PASS'],'to':['1084328481@qq.com']}, open('_mail.json','w'))"
          echo "邮件配置已写入（内容不回显）"

      - name: 生成信号并发信
        run: |
          # 用 if 而不是 `[ ... ] && ARGS=...`：后者条件为假时整行返回非 0，
          # 依 bash -e 的例外规则虽然不会中断，但那是隐式豁免。if 语义明确。
          ARGS=""
          # 不再按 `date -u +%H == 01` 判定日报：schedule 实测延迟 30~60 分钟甚至整班漏跑，
          # 最近 7 次运行没有一次落在 01 点，日报因此一次都没发出去。
          # 「今天有没有发过」改由 notify_mail.py 读台账 last_sent_bj 自己判断。
          if [ "${{ inputs.digest }}" = "true" ]; then ARGS="$ARGS --digest"; fi
          if [ "${{ inputs.always }}" = "true" ]; then ARGS="$ARGS --always"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "UTC 时刻：$(date -u +'%Y-%m-%d %H:%M')　参数：${ARGS:-（自动判定）}"
          python run_signal.py $ARGS
          echo "--- 发信台账（bar4h=算到哪根 4H，last_sent_bj=今天是否已有信）---"
          cat .notify_state.json 2>/dev/null || echo "(台账不存在)"
          echo
