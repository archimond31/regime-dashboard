name: Crypto Signal (4H)

# 触发方式：只由外部定时器通过 workflow_dispatch API 触发，不用 schedule。
#
# 为什么弃用 GitHub cron —— 这是实测数据，不是猜测：
#   应触发 11-10 16:05 → 实际 19:39（+3h34m）
#   应触发 11-11 00:05 → 实际 00:36（+31m）
#   同期 dashboard 的 13:30 定时 → 实际 20:30（+7h）和 23:03（+9h33m）
#   6 次/天只落到 2 次，漏跑是实打实的
# 对 4H 突破策略，晚 3.5 小时意味着回测里的入场价已经不存在了。
# GitHub 官方也明确 schedule 是 best-effort，高负载时会延迟甚至丢弃。
#
# 外部定时器（如 cron-job.org）按 UTC 01/04/08/12/16/20 各 :05 调用本工作流。
# 其中 UTC 01:05（北京 09:05）那次自动转成「日报」，无动作也发，
# 于是「今天没收到任何邮件」只可能表示链路故障 —— 沉默不再有歧义。
on:
  workflow_dispatch:
    inputs:
      digest:
        description: '强制按日报模式发（每天北京最多一封）。UTC 01 点那次会自动开启'
        type: boolean
        default: false
      always:
        description: '本轮无动作也发信（仍受同 bar 去重）'
        type: boolean
        default: false
      force:
        description: '忽略去重台账，强制重发'
        type: boolean
        default: false

# 只读：本流程不回写仓库
permissions:
  contents: read

concurrency:
  group: crypto-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 语法预检：3.11 比本地 3.13 严格 —— f-string 表达式里的反斜杠在 3.12 才放开
      # （PEP 701），本地能跑、云端报 SyntaxError。放在取数之前，让错误以「语法」的名义出现，
      # 而不是埋在几分钟下载之后的 traceback 里。
      - name: 语法预检（按 3.11 规则编译全部脚本）
        run: |
          python - <<'PY'
          import glob, py_compile, sys
          bad = []
          for f in sorted(glob.glob("*.py")):
              try:
                  py_compile.compile(f, cfile=None, doraise=True)
              except py_compile.PyCompileError as e:
                  msg = str(e).strip().splitlines()[-1]
                  bad.append((f, msg))
          for f, m in bad:
              print(f"::error file={f}::{m}")
          if bad:
              sys.exit(1)
          print(f"语法预检通过（{len(glob.glob('*.py'))} 个文件）")
          PY

      # 缓存按「UTC 日期」分桶：当天第一次跑存一份，后几次直接命中。
      # 不能按 run_id 做 key —— 那样每次都会存一份 77 MB，很快撑爆缓存配额。
      - name: 生成缓存日期键
        id: k
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 恢复 K 线缓存 + 去重台账
        uses: actions/cache@v4
        with:
          path: |
            .cache_binance
            .cache_hl
            .notify_state.json
          key: sig-cache-${{ steps.k.outputs.day }}
          restore-keys: |
            sig-cache-

      - name: 写入邮件配置
        env:
          SMTP_PASS: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::缺少 secret QQ_SMTP_AUTH_CODE（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          python -c "import json,os; json.dump({'host':'smtp.qq.com','port':465,'user':'1084328481@qq.com','pass':os.environ['SMTP_PASS'],'to':['1084328481@qq.com']}, open('_mail.json','w'))"
          echo "邮件配置已写入（内容不回显）"

      - name: 生成信号并发信
        run: |
          # 用 if 而不是 `[ ... ] && ARGS=...`：后者条件为假时整行返回非 0，
          # 依 bash -e 的例外规则虽然不会中断，但那是隐式豁免。if 语义明确。
          ARGS=""
          HOUR=$(date -u +%H)
          DIGEST="${{ inputs.digest }}"
          # UTC 01 点（北京 09:05）那一次默认转日报，外部定时器不必额外传参
          if [ "$DIGEST" = "true" ] || [ "$HOUR" = "01" ]; then ARGS="$ARGS --digest"; fi
          if [ "${{ inputs.always }}" = "true" ]; then ARGS="$ARGS --always"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "UTC 小时：$HOUR"
          echo "参数：${ARGS:-（默认：有动作才发）}"
          python run_signal.py $ARGS
